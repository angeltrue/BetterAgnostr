name: Chromium stand-alone pre-release (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chromium-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine versions
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ARTIFACT="${TAG%-chromium.*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Locate release notes
        id: notes
        run: |
          FILE="release/RELEASE_NOTES-${{ steps.version.outputs.tag }}.md"
          if [ -f "$FILE" ]; then
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove existing pre-release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true

      - name: Publish Chromium pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: Better Agnostr Chromium ${{ steps.version.outputs.artifact }} (pre-release)
          body_path: ${{ steps.notes.outputs.file }}
          prerelease: true
          files: |
            release/better-agnostr-${{ steps.version.outputs.artifact }}-chromium.zip
          fail_on_unmatched_files: true
